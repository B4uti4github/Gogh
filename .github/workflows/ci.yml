name: CI
on:
  push:
    branches: [ main, feature/thorvg-submodule-and-bindings ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Initialize submodules (redundant with checkout if submodules:true)
        run: |
          ./scripts/setup-submodules.sh

      - name: Install dependencies
        run: |
          set -e
          ZIG_VER=0.11.0
          curl -L -o zig.tar.xz "https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz"
          tar -xf zig.tar.xz
          echo "ZIG=$(pwd)/zig-linux-x86_64-0.11.0" >> $GITHUB_ENV

      - name: Optional: build Thorvg (requires cmake, ninja)
        run: |
          echo "Intentando build de Thorvg (si el submódulo provee CMakeLists). Si falla, ignorar y continuar con build principal."
          set -e || true
          if [ -d "third_party/thorvg" ]; then
            if [ -f "third_party/thorvg/CMakeLists.txt" ]; then
              sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
              mkdir -p third_party/thorvg/build
              pushd third_party/thorvg/build
              cmake -G Ninja ..
              ninja || true
              popd
            else
              echo "third_party/thorvg no tiene CMakeLists.txt en la raiz — saltando build automático."
            fi
          fi

      - name: Build with Zig
        run: |
          $ZIG/bin/zig build || true

      - name: List tree
        run: |
          ls -la
