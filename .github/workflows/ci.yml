name: CI
on:
  push:
    branches: [ main, feature/thorvg-submodule-and-bindings ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Initialize submodules (redundant with checkout if submodules:true)
        run: |
          ./scripts/setup-submodules.sh

      - name: Install dependencies (cmake, ninja, build tools and libs for Thorvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libpng-dev libjpeg-dev libwebp-dev

      - name: Build Thorvg from submodule (if CMakeLists present)
        run: |
          chmod +x ./scripts/build-thorvg.sh
          ./scripts/build-thorvg.sh || true

      - name: Install Zig
        run: |
          set -e
          ZIG_VER=0.11.0
          curl -L -o zig.tar.xz "https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz"
          tar -xf zig.tar.xz
          echo "ZIG=$(pwd)/zig-linux-x86_64-0.11.0" >> $GITHUB_ENV

      - name: Build with Zig
        run: |
          $ZIG/bin/zig build

      - name: List artifacts
        run: |
          ls -la
