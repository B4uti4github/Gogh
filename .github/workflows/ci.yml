name: CI
on:
  push:
    branches: [ main, feature/thorvg-submodule-and-bindings ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Ensure submodule directory exists (fallback to clone if needed)
        run: |
          if [ ! -d "third_party/thorvg" ]; then
            echo "third_party/thorvg not present — cloning directly from upstream"
            git clone --depth 1 https://github.com/thorvg/thorvg third_party/thorvg
          else
            echo "third_party/thorvg exists"
          fi
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Ensure setup script is executable and run it
        run: |
          chmod +x ./scripts/setup-submodules.sh || true
          ./scripts/setup-submodules.sh

      - name: Install dependencies (cmake, ninja, build tools and libs for Thorvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libpng-dev libjpeg-dev libwebp-dev

      - name: Ensure build script is executable and build Thorvg from submodule (if CMakeLists present)
        run: |
          chmod +x ./scripts/build-thorvg.sh || true
          ./scripts/build-thorvg.sh

      - name: Export include/lib paths for Thorvg
        run: |
          if [ -d "third_party/thorvg/build" ]; then
            echo "CPATH=$(pwd)/third_party/thorvg/include" >> $GITHUB_ENV
            echo "LIBRARY_PATH=$(pwd)/third_party/thorvg/build" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$(pwd)/third_party/thorvg/build" >> $GITHUB_ENV
          fi

      - name: Install Zig
        run: |
          set -e
          ZIG_VER=0.11.0
          ZIG_FILE="zig-linux-x86_64-${ZIG_VER}.tar.xz"
          echo "Downloading $ZIG_FILE"
          # retry download a few times
          curl -L --retry 3 --retry-delay 5 -o "$ZIG_FILE" "https://ziglang.org/download/${ZIG_VER}/${ZIG_FILE}"
          echo "Extracting $ZIG_FILE"
          # use explicit xz extraction flag
          tar -xJf "$ZIG_FILE"
          ZIG_DIR=$(tar -tf "$ZIG_FILE" | head -1 | cut -f1 -d"/")
          echo "Detected Zig directory: $ZIG_DIR"
          if [ -d "$ZIG_DIR" ] && [ -x "$ZIG_DIR/bin/zig" ]; then
            echo "ZIG=$(pwd)/$ZIG_DIR" >> $GITHUB_ENV
          else
            echo "ERROR: Zig extraction failed or bin/zig not present. Listing files:" >&2
            ls -la || true
            tar -tf "$ZIG_FILE" | sed -n '1,200p' || true
            exit 1
          fi

      - name: Build with Zig
        env:
          CPATH: ${{ env.CPATH }}
          LIBRARY_PATH: ${{ env.LIBRARY_PATH }}
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
          ZIG: ${{ env.ZIG }}
        run: |
          echo "Using ZIG at $ZIG"
          $ZIG/bin/zig build

      - name: List artifacts
        run: |
          ls -la
